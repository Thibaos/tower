[package]
name = "tower"
version = "0.1.0"
edition = "2021"
publish = false
exclude = ["dist", "build", "assets", "credits"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 'z'

[dependencies]
bevy = { version = "0.14", features = [
    "bevy_asset",
    "bevy_winit",
    "png",
    "x11",
] }
bevy_asset_loader = { version = "0.21" }
bevy_egui = { version = "0.30", default-features = false }
bevy_flycam = "0.14"
bevy_hanabi = { version = "0.12", default-features = false, features = ["3d"] }
# bevy-inspector-egui = "0.24"
bevy_kira_audio = { version = "0.20" }
bevy_rapier3d = { version = "0.27", features = ["debug-render"] }
image = { version = "0.25", default-features = false }
rand = { version = "0.8" }
smooth-bevy-cameras = "0.12"
wasm-timer = "0.2.5"
winit = { version = "0.30", default-features = false }

[build-dependencies]
embed-resource = "2.5"
